name: Bug report
description: Something isn't working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please fill in every required field so we can reproduce the issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
        - label: I'm using the latest version.
          required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown under Settings, or in the VERSION file at the project root.
      placeholder: e.g. 1.30.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP version, web server, hosting type, and browser. Settings lists your PHP and SQLite versions.
      placeholder: |
        PHP: 8.2.20
        Web server: Apache
        Hosting: shared cPanel
        Browser: Firefox 141
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste as plain text. This is formatted as code automatically. Remove any secrets, including API keys.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or anything else that helps.
